<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Travel Survey Kiosk</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #eef3f8;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: white;
      width: 100%;
      max-width: 620px;
      border-radius: 24px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.12);
    }
    h1 { margin: 0 0 8px; font-size: 34px; }
    h2 { margin: 0 0 8px; font-size: 28px; }
    h3 { margin: 26px 0 14px; font-size: 21px; }
    p { margin: 0 0 20px; color: #475569; font-size: 17px; }
    label.title { display:block; font-weight: bold; font-size: 20px; margin: 24px 0 10px; }
    select {
      width: 100%;
      padding: 16px;
      font-size: 20px;
      border: 1px solid #cbd5e1;
      border-radius: 16px;
      background: white;
      margin-bottom: 24px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 16px;
      padding: 17px;
      font-size: 21px;
      font-weight: bold;
      cursor: pointer;
    }
    .primary { background: #2563eb; color: white; }
    .submit { background: #111827; color: white; margin-top: 28px; font-size: 24px; padding: 20px; }
    .finish { background: #dc2626; color: white; margin-top: 12px; }
    .secondary { background: #334155; color: white; margin-top: 12px; }
    .change {
      background: transparent;
      color: #2563eb;
      text-decoration: underline;
      width: auto;
      padding: 0;
      font-size: 15px;
      font-weight: normal;
    }
    .hidden { display: none; }
    .meta {
      color: #475569;
      line-height: 1.5;
      margin-bottom: 16px;
      font-size: 16px;
    }
    .toprow {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start;
    }
    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }
    input[type="radio"] { display: none; }
    .option {
      border: 2px solid #cbd5e1;
      border-radius: 16px;
      padding: 16px 10px;
      text-align: center;
      font-size: 19px;
      cursor: pointer;
      min-height: 82px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      user-select: none;
      line-height: 1.25;
    }
    .emoji { font-size: 24px; margin-bottom: 4px; }
    .small { font-size: 13px; margin-top: 4px; color: inherit; font-weight: bold; }
    input[name="usual"]:checked + .option { background: #2563eb; color: white; border-color: #2563eb; }
    input[name="preferred"]:checked + .option { background: #16a34a; color: white; border-color: #16a34a; }
    .counter {
      text-align: center;
      color: #475569;
      margin-top: 20px;
      font-size: 16px;
    }
    .status {
      text-align: center;
      color: #475569;
      margin-top: 8px;
      min-height: 22px;
      font-size: 15px;
    }
    .totals {
      background: #f1f5f9;
      border-radius: 16px;
      padding: 16px;
      margin-top: 14px;
      white-space: pre-wrap;
      font-family: Consolas, monospace;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">

    <div id="setupScreen">
      <h1>Travel Survey</h1>
      <p>Select the form once, then pass the phone around.</p>

      <label class="title" for="formSelect">Form</label>
      <select id="formSelect">
        <option value="">Select form...</option>
        <option value="7SIC|30|Miss Islam-Choudhury|LAB 13">7SIC (30) — Miss Islam-Choudhury — LAB 13</option>
        <option value="8LOS|29|Ms O'Sullivan|LAB 20">8LOS (29) — Ms O'Sullivan — LAB 20</option>
        <option value="8MA|31|Ms Mascia|Room 66">8MA (31) — Ms Mascia — Room 66</option>
        <option value="8NO|30|Ms Noor|Room 38">8NO (30) — Ms Noor — Room 38</option>
        <option value="9AD|29|Mr Ahmed|Room 111">9AD (29) — Mr Ahmed — Room 111</option>
        <option value="9TE|30|Miss Taner|Room 51">9TE (30) — Miss Taner — Room 51</option>
        <option value="10KJ|29|Miss Khan|Room SF5">10KJ (29) — Miss Khan — Room SF5</option>
        <option value="11KN|30|Miss Khanam|Room 15">11KN (30) — Miss Khanam — Room 15</option>
        <option value="11OA|30|Ms Olulana|Room 33">11OA (30) — Ms Olulana — Room 33</option>
        <option value="11YF|31|Ms Yousaf|Room 7">11YF (31) — Ms Yousaf — Room 7</option>
        <option value="12AI|29|Mr Aidoo|Room 55">12AI (29) — Mr Aidoo — Room 55</option>
        <option value="12TMU|27|Mr Murshid|Room 112">12TMU (27) — Mr Murshid — Room 112</option>
      </select>

      <button class="primary" id="startButton" type="button" onclick="startSurvey()">Start Survey</button>
    </div>

    <div id="surveyScreen" class="hidden">
      <div class="toprow">
        <div>
          <h2>Travel Survey</h2>
          <div class="meta">
            Form: <strong id="currentForm"></strong><br>
            Tutor: <strong id="currentTutor"></strong><br>
            Room: <strong id="currentRoom"></strong>
          </div>
        </div>
        <button class="change" type="button" onclick="changeForm()">Change Form</button>
      </div>

      <form id="surveyForm">
        <h3>How do you usually travel to school?</h3>
        <div class="grid">
          <label><input type="radio" name="usual" value="Walk" required><div class="option"><span class="emoji">🚶</span>Walk</div></label>
          <label><input type="radio" name="usual" value="Bus"><div class="option"><span class="emoji">🚌</span>Bus</div></label>
          <label><input type="radio" name="usual" value="Train"><div class="option"><span class="emoji">🚆</span>Train</div></label>
          <label><input type="radio" name="usual" value="Cycle"><div class="option"><span class="emoji">🚲</span>Cycle</div></label>
          <label><input type="radio" name="usual" value="Park and Stride"><div class="option"><span class="emoji">🚗🚶</span>Car — dropped off further away<span class="small">walk 10+ mins</span></div></label>
          <label><input type="radio" name="usual" value="Car"><div class="option"><span class="emoji">🚗⬇️</span>Car — dropped off near school<span class="small">walk less than 10 mins</span></div></label>
        </div>

        <h3>How would you prefer to travel to school?</h3>
        <div class="grid">
          <label><input type="radio" name="preferred" value="Walk" required><div class="option"><span class="emoji">🚶</span>Walk</div></label>
          <label><input type="radio" name="preferred" value="Bus"><div class="option"><span class="emoji">🚌</span>Bus</div></label>
          <label><input type="radio" name="preferred" value="Train"><div class="option"><span class="emoji">🚆</span>Train</div></label>
          <label><input type="radio" name="preferred" value="Cycle"><div class="option"><span class="emoji">🚲</span>Cycle</div></label>
          <label><input type="radio" name="preferred" value="Park and Stride"><div class="option"><span class="emoji">🚗🚶</span>Car — dropped off further away<span class="small">walk 10+ mins</span></div></label>
          <label><input type="radio" name="preferred" value="Car"><div class="option"><span class="emoji">🚗⬇️</span>Car — dropped off near school<span class="small">walk less than 10 mins</span></div></label>
        </div>

        <button class="submit" type="submit">Submit</button>
      </form>

      <div class="counter">Responses collected: <strong id="responseCount">0</strong> / <strong id="classSize">0</strong></div>
      <div class="status" id="saveStatus"></div>

      <button class="secondary" type="button" onclick="showTotals()">View Totals</button>
      <button class="finish" type="button" onclick="finishClass()">Finish Class</button>

      <div id="totalsOutput" class="totals hidden"></div>
    </div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxdfu2RE7XDWSQ72ospBNhFv5O5asDUSizTprMRU0DGu33pNOHws-mEKfdYQ-5A06_B/exec";

    let selectedForm = "";
    let selectedTutor = "";
    let selectedRoom = "";
    let classSize = 0;
    let responseCount = 0;
    let responses = [];

    function startSurvey() {
      const select = document.getElementById("formSelect");
      const value = select.value;

      if (!value) {
        alert("Select a form first");
        return;
      }

      const parts = value.split("|");
      selectedForm = parts[0];
      classSize = Number(parts[1]);
      selectedTutor = parts[2];
      selectedRoom = parts[3];

      document.getElementById("currentForm").textContent = selectedForm;
      document.getElementById("currentTutor").textContent = selectedTutor;
      document.getElementById("currentRoom").textContent = selectedRoom;
      document.getElementById("classSize").textContent = classSize;
      document.getElementById("responseCount").textContent = responseCount;

      document.getElementById("setupScreen").classList.add("hidden");
      document.getElementById("surveyScreen").classList.remove("hidden");
    }

    function changeForm() {
      document.getElementById("setupScreen").classList.remove("hidden");
      document.getElementById("surveyScreen").classList.add("hidden");
    }

    document.getElementById("surveyForm").addEventListener("submit", function(event) {
      event.preventDefault();

      const usual = document.querySelector("input[name='usual']:checked");
      const preferred = document.querySelector("input[name='preferred']:checked");

      if (!usual || !preferred) {
        alert("Choose both answers before submitting");
        return;
      }

      const response = {
        form: selectedForm,
        tutor: selectedTutor,
        room: selectedRoom,
        usual: usual.value,
        preferred: preferred.value,
        timestamp: new Date().toISOString()
      };

      responses.push(response);
      responseCount++;
      document.getElementById("responseCount").textContent = responseCount;
      document.getElementById("saveStatus").textContent = "Saving...";

      fetch(SCRIPT_URL, {
        method: "POST",
        mode: "no-cors",
        body: JSON.stringify(response)
      })
      .then(function() {
        document.getElementById("saveStatus").textContent = "Saved. Pass to next student.";
      })
      .catch(function() {
        document.getElementById("saveStatus").textContent = "Saved on this phone only. Tell Mr Agossa.";
      });

      document.getElementById("surveyForm").reset();
      document.getElementById("totalsOutput").classList.add("hidden");
    });

    function showTotals() {
      const travelOptions = ["Walk", "Bus", "Train", "Cycle", "Park and Stride", "Car"];
      const usualTotals = {};
      const preferredTotals = {};

      travelOptions.forEach(function(option) {
        usualTotals[option] = 0;
        preferredTotals[option] = 0;
      });

      responses.forEach(function(response) {
        usualTotals[response.usual]++;
        preferredTotals[response.preferred]++;
      });

      let output = selectedForm + " TOTALS\n\n";
      output += "USUAL TRAVEL\n";
      travelOptions.forEach(function(option) {
        output += option + ": " + usualTotals[option] + "\n";
      });

      output += "\nPREFERRED TRAVEL\n";
      travelOptions.forEach(function(option) {
        output += option + ": " + preferredTotals[option] + "\n";
      });

      const totalsOutput = document.getElementById("totalsOutput");
      totalsOutput.textContent = output;
      totalsOutput.classList.remove("hidden");
    }

    function finishClass() {
      const answer = confirm("Finish this class and return to form selection?");
      if (!answer) return;

      document.getElementById("surveyForm").reset();
      document.getElementById("totalsOutput").classList.add("hidden");
      document.getElementById("saveStatus").textContent = "";

      selectedForm = "";
      selectedTutor = "";
      selectedRoom = "";
      classSize = 0;
      responseCount = 0;
      responses = [];

      document.getElementById("responseCount").textContent = "0";
      document.getElementById("classSize").textContent = "0";
      document.getElementById("formSelect").value = "";

      document.getElementById("setupScreen").classList.remove("hidden");
      document.getElementById("surveyScreen").classList.add("hidden");
    }
  </script>
</body>
</html>
